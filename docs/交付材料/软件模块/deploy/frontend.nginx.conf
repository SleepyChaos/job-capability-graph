server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端为 hash 路由，单页应用回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端服务（compose 服务名 backend）
    #
    # 简历上传、岗位表达生成等请求会同步等待 LLM 返回，后端的 LLM 超时配到了
    # 120s（APP_LLM_TIMEOUT_SECONDS），而 nginx 的 proxy_read_timeout 默认只有
    # 60s：耗时落在 60~120s 的请求会被 nginx 判超时、给浏览器回 504，后端其实
    # 还在正常处理。两侧对齐到 300s，让后端的超时成为唯一那道闸。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
