<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" font-family="Source Han Sans SC, Microsoft YaHei, sans-serif">
  <style>
    .ti{font-size:17px;font-weight:600;fill:#12202e}
    .h{font-size:14px;font-weight:600;fill:#1f2b38}
    .t{font-size:13px;fill:#1f2b38}
    .s{font-size:11.5px;fill:#5b6b7c}
    .ax{stroke:#8fa3b8;stroke-width:1.2}
    .grid{stroke:#e3e9ef;stroke-width:1}
    .barA{fill:#c9d6e2}
    .barB{fill:#3f7cc4}
    .zone{fill:#fdf3e7;stroke:#d08a35;stroke-width:1;stroke-dasharray:4 3}
  </style>
  <text x="20" y="28" class="ti">图 4-2　候选粒度决定覆盖率测量的分辨率</text>
  <text x="20" y="48" class="s">同一份语料、同一套阈值。左：候选为技术对，覆盖率只能取三个值；右：候选为频繁技术组合。</text>

  <!-- 左图 -->
  <text x="60" y="86" class="h">改进前　候选 = 技术对（|候选| ≡ 2）</text>
  <line x1="70" y1="330" x2="430" y2="330" class="ax"/>
  <line x1="70" y1="110" x2="70" y2="330" class="ax"/>
  <line x1="70" y1="240" x2="430" y2="240" class="grid"/>
  <line x1="70" y1="175" x2="430" y2="175" class="grid"/>
  <text x="40" y="334" class="s">0</text>
  <text x="30" y="244" class="s">50</text>
  <text x="30" y="179" class="s">75</text>
  <text x="24" y="114" class="s">100</text>

  <rect x="100" y="325" width="66" height="5" class="barA"/>
  <rect x="210" y="319" width="66" height="11" class="barA"/>
  <rect x="320" y="112" width="66" height="218" class="barA"/>
  <text x="112" y="348" class="s">0.0</text>
  <text x="222" y="348" class="s">0.5</text>
  <text x="332" y="348" class="s">1.0</text>
  <text x="336" y="106" class="t" font-weight="600">91</text>
  <text x="150" y="372" class="s">覆盖率取值（仅三个可能值）</text>
  <rect x="316" y="96" width="76" height="246" class="zone" fill="none"/>
  <text x="150" y="398" class="s" fill="#b5651d">91/100 落在同一档 → 三档分类形同虚设</text>

  <!-- 右图 -->
  <text x="530" y="86" class="h">改进后　候选 = 频繁闭项集（|候选| = 3–5）</text>
  <line x1="540" y1="330" x2="900" y2="330" class="ax"/>
  <line x1="540" y1="110" x2="540" y2="330" class="ax"/>
  <line x1="540" y1="240" x2="900" y2="240" class="grid"/>
  <line x1="540" y1="175" x2="900" y2="175" class="grid"/>

  <rect x="562" y="317" width="44" height="13" class="barB"/>
  <rect x="622" y="286" width="44" height="44" class="barB"/>
  <rect x="682" y="286" width="44" height="44" class="barB"/>
  <rect x="742" y="317" width="44" height="13" class="barB"/>
  <rect x="802" y="199" width="44" height="131" class="barB"/>
  <text x="566" y="311" class="s">6</text>
  <text x="628" y="280" class="s">17</text>
  <text x="688" y="280" class="s">12</text>
  <text x="748" y="311" class="s">6</text>
  <text x="812" y="193" class="t" font-weight="600">59</text>
  <text x="560" y="348" class="s">0.33</text>
  <text x="620" y="348" class="s">0.50</text>
  <text x="680" y="348" class="s">0.67</text>
  <text x="740" y="348" class="s">0.75</text>
  <text x="800" y="348" class="s">1.00</text>
  <text x="620" y="372" class="s">覆盖率取值细化</text>
  <text x="586" y="398" class="s" fill="#2c6b3f">三档分类均有分布：潜在 6 / 演化 29 / 既有 65</text>
</svg>
