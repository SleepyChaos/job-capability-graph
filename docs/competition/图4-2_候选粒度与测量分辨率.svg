<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="PingFang SC, Source Han Sans SC, Microsoft YaHei, sans-serif">
  <style>
    .ti{font-size:19px;font-weight:600;fill:#12202e}
    .h{font-size:15px;font-weight:600;fill:#1f2b38}
    .t{font-size:13.5px;fill:#1f2b38}
    .s{font-size:12px;fill:#5b6b7c}
    .axis{stroke:#8fa3b8;stroke-width:1.6}
    .thr{stroke:#d08a35;stroke-width:1.3;stroke-dasharray:5 4}
    .thrtx{font-size:11.5px;fill:#b5651d}
    .lead{stroke:#b8c4d0;stroke-width:1}
    .dotA{fill:#a9b8c7;stroke:#7d8fa1;stroke-width:1.2}
    .dotB{fill:#3f7cc4;stroke:#2b5c96;stroke-width:1.2}
    .band{fill:#f4f7fa}
    .inv{fill:#ffffff;font-size:13.5px;font-weight:600}
  </style>

  <text x="24" y="32" class="ti">图 4-2　候选粒度决定覆盖率测量的分辨率</text>
  <text x="24" y="56" class="s">横轴为非对称覆盖率。圆点标出该粒度下覆盖率实际可能取到的值，点面积正比于候选数量；竖虚线为三档分类的两个阈值。</text>

  <!-- 改进前 -->
  <text x="24" y="108" class="h">改进前　候选 = 技术对，|候选| ≡ 2</text>
  <rect x="96" y="124" width="1064" height="60" class="band" rx="4"/>
  <line x1="110" y1="170" x2="1150" y2="170" class="axis"/>
  <line x1="578" y1="124" x2="578" y2="184" class="thr"/>
  <line x1="890" y1="124" x2="890" y2="184" class="thr"/>
  <text x="552" y="118" class="thrtx">0.45</text>
  <text x="864" y="118" class="thrtx">0.75</text>

  <circle cx="110" cy="170" r="5" class="dotA"/>
  <circle cx="630" cy="170" r="9" class="dotA"/>
  <circle cx="1150" cy="170" r="27" class="dotA"/>
  <text x="110" y="200" class="s" text-anchor="middle">0.0</text>
  <text x="630" y="200" class="s" text-anchor="middle">0.5</text>
  <text x="1150" y="216" class="s" text-anchor="middle">1.0</text>
  <text x="1150" y="176" class="inv" text-anchor="middle">91</text>

  <text x="110" y="242" class="s">覆盖率只有 3 个可能取值；100 个候选中 91 个恰为 1.0。</text>
  <text x="110" y="262" class="s" fill="#b5651d">两个阈值之间不存在任何取值 —— 三档分类无法分档。</text>

  <!-- 改进后 -->
  <text x="24" y="318" class="h">改进后　候选 = 频繁闭项集，|候选| = 3–5</text>
  <rect x="96" y="334" width="1064" height="60" class="band" rx="4"/>
  <line x1="110" y1="380" x2="1150" y2="380" class="axis"/>
  <line x1="578" y1="334" x2="578" y2="394" class="thr"/>
  <line x1="890" y1="334" x2="890" y2="394" class="thr"/>
  <text x="552" y="328" class="thrtx">0.45</text>
  <text x="864" y="328" class="thrtx">0.75</text>

  <circle cx="453" cy="380" r="6" class="dotB"/>
  <circle cx="807" cy="380" r="14" class="dotB"/>
  <circle cx="890" cy="380" r="9" class="dotB"/>
  <circle cx="942" cy="380" r="6" class="dotB"/>
  <circle cx="1150" cy="380" r="18" class="dotB"/>

  <text x="453" y="356" class="s" text-anchor="middle">2</text>
  <text x="807" y="385" class="inv" text-anchor="middle">12</text>
  <text x="890" y="356" class="s" text-anchor="middle">4</text>
  <text x="942" y="356" class="s" text-anchor="middle">2</text>
  <text x="1150" y="385" class="inv" text-anchor="middle">21</text>

  <text x="453" y="410" class="s" text-anchor="middle">0.33</text>
  <text x="807" y="410" class="s" text-anchor="middle">0.67</text>
  <line x1="890" y1="392" x2="890" y2="424" class="lead"/>
  <text x="890" y="438" class="s" text-anchor="middle">0.75</text>
  <text x="942" y="410" class="s" text-anchor="middle">0.80</text>
  <text x="1150" y="410" class="s" text-anchor="middle">1.00</text>

  <text x="110" y="438" class="s">覆盖率取到 5 个不同水平（41 个候选），三档分类均有分布：</text>
  <text x="110" y="460" class="s" fill="#2c6b3f">潜在新岗位 2　·　岗位演化 12　·　既有岗位 27</text>
</svg>
