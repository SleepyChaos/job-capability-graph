server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩。
    #
    # 图谱产物 job-ecosystem-graph.json 有 39.5MB，裸传在 3Mbps 的服务器带宽下要 113s，
    # 岗位画像图谱页 95% 的加载时间都耗在这一个文件上（后端接口只要 26~280ms）。JSON
    # 极度可压，gzip 后是 4.0MB（9.8:1），同一条链路降到 ~12s。
    #
    # nginx:alpine 官方镜像里 gzip 默认是注释掉的，必须在这里显式打开。
    #
    # gzip_static 优先发构建阶段预压好的 .gz（见 Dockerfile）：39.5MB 现压一次约 0.45s
    # CPU，服务器只有 3.6GB 内存、核数不多，不该让每个访客都付这笔账。预压产物缺失时
    # 自动回落到下面的实时 gzip，不会 404。
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;

    # 前端为 hash 路由，单页应用回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端服务（compose 服务名 backend）
    #
    # 简历上传、岗位表达生成等请求会同步等待 LLM 返回，后端的 LLM 超时配到了
    # 120s（APP_LLM_TIMEOUT_SECONDS），而 nginx 的 proxy_read_timeout 默认只有
    # 60s：耗时落在 60~120s 的请求会被 nginx 判超时、给浏览器回 504，后端其实
    # 还在正常处理。两侧对齐到 300s，让后端的超时成为唯一那道闸。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
