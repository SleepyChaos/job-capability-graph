    content: "我们是一家以机器人为核心的科技公司，业务横跨国内与海外多个市场，核心系统大规模运行于国内（阿里云、腾讯云、火山引擎等）与海外（AWS、Azure、GCP 等）多家公有云之上；随着多云规模快速扩张，我们正在搭建统一的云平台工程能力，把「账号、网络、权限、资源、成本」沉淀为可治理、可自助、可观测、可审计的平台化服务； 我们正在寻找一位具备体系化思维的 SRE 工程师（公有云方向）；你将以平台化、规范化、自动化的方式，统筹国内外多云环境的规范制定、资源交付、成本管理、账号管理四大职责：从 0 到 1 设计并落地多云治理框架与 Landing Zone（落地区），建设以 IaC 为核心的自助化资源交付平台，主导多云组织/账号体系与统一身份权限管控，并以 FinOps 为抓手建立从账单归集到降本运营的完整闭环； 这不是一个「开通账号、处理工单」的执行型岗位；你需要把分散在多个云厂商、多条业务线的云资源，治理成一套标准、安全、可复制、可量化的体系，在保障合规与稳定性基线的同时，持续提升交付效率并控制成本——让规范不止停留在文档，让降本落到每一分预算。 主要职责 1. 多云治理规范与 Landing Zone 落地 主导制定面向阿里云、腾讯云、华为云、火山引擎及 AWS、Azure、GCP 的多云治理框架，沉淀账号、网络、标签/命名、权限、安全等核心规范与基线标准；设计并实施多云 Landing Zone，规划组织结构、账号分层（管理/安全/日志/共享服务/生产/测试等）、网络拓扑与集中日志审计，通过组织策略（SCP/控制策略）、防护栏（Guardrails）与 Account Factory 把规范固化为不可绕过的平台约束，保证每个新落地的账号天然合规。 2. IaC 与自助化资源交付平台建设 以 Terraform / OpenTofu / Pulumi 为核心，沉淀覆盖国内外多云的可复用模块（VPC、子网、安全组、K8s 集群、数据库、对象存储、负载均衡等），建设自助化资源交付平台与服务目录，让研发团队通过标准化模板自助申请、按需交付云资源；制定交付 SLA 与质量标准，持续降低人工介入比例与交付时长，提升交付的速度与一致性。 3. 交付流水线与策略即代码（Policy as Code） 设计并维护资源交付的 CI/CD 流水线，落地 IaC 代码评审、plan 预检、策略即代码（OPA / Sentinel / Config Rules）、自动化合规校验与灰度发布；以 GitOps 方式管理基础设施变更，在交付管道中前置拦截不合规资源，实现「先合规、后交付」，确保所有云资源变更可追溯、可审计、可回滚，降低人为误操作与配置漂移风险。 4. 容量、配额与稳定性保障 建立跨云的容量规划与配额（Quota）管理机制，统一监控并申报各云厂商的资源配额（实例、IP、API 调用、专有网络等），对高风险资源设置限流与告警，提前预测增长趋势，避免因配额耗尽或容量瓶颈导致业务故障；为关键平台服务定义 SLI/SLO 与错误预算，主导故障应急与事故复盘（Postmortem），持续降低 MTTR。 5. 多云组织与账号体系管理 建设并维护多云组织（阿里云资源目录、AWS Organizations、腾讯云组织、Azure Management Groups 等）与账号体系，设计账号分级、分组与 OU/资源夹结构；统一账号生命周期管理（申请、审批、创建、回收），建立账号台账与归属、责任人、计费归集映射，杜绝「野生账号」与计费黑洞，确保账号结构与成本归属、分摊模型保持一致。 "
